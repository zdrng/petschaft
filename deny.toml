# cargo-deny: supply-chain policy (run: nix develop -c cargo deny check)

[graph]
all-features = true

[advisories]
# RustSec advisory database (needs network; run in CI or manually).
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0370", reason = "zvariant: transitive via keyring; unmaintained, no known vulnerability; revisit when keyring moves to zbus 6" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: transitive via keyring; unmaintained, no known vulnerability; revisit when keyring moves to zbus 6" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: transitive via keyring; unmaintained, no known vulnerability; revisit when keyring moves to zbus 6" },
]

[licenses]
version = 2
# Everything must be compatible with GPL-3.0-or-later (this project's license).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "GPL-3.0-or-later",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
