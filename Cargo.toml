[workspace]
resolver = "3"
exclude = ["fuzz"]
members = ["crates/petschaft-core", "crates/petschaft-helper-proto", "crates/petschaft-device", "crates/petschaft-sshsig", "crates/petschaft-fido2", "crates/petschaft-agent", "crates/petschaft-apk", "crates/petschaft"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
petschaft-core = { path = "crates/petschaft-core" }
petschaft-helper-proto = { path = "crates/petschaft-helper-proto" }
petschaft-device = { path = "crates/petschaft-device" }
petschaft-sshsig = { path = "crates/petschaft-sshsig" }
petschaft-fido2 = { path = "crates/petschaft-fido2" }
petschaft-agent = { path = "crates/petschaft-agent" }
petschaft-apk = { path = "crates/petschaft-apk" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
anyhow = "1"
sha2 = "0.11"
ed25519-dalek = "3"
p256 = "0.14"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
keyring = "4"
getrandom = "0.4"

proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
dbg_macro = "deny"
todo = "warn"

[profile.release]
# A panic ends the whole process (e.g. one in the agent's device worker thread), so
# systemd / launchd restart it instead of leaving a half-working daemon.
panic = "abort"
