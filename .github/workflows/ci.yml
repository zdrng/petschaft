name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token; the workflow needs no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: nix flake check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest: x86_64-linux; macos-latest: aarch64-darwin (Apple Silicon)
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      # Pinned by version tag. For supply-chain hardening, pin each action to a
      # full commit SHA instead (e.g. `uses: actions/checkout@<sha> # v5`).
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: nix flake check
        run: nix flake check -L

  supply-chain:
    name: cargo deny (licenses, sources, RustSec advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: cargo deny check
        run: nix develop -c cargo deny check
